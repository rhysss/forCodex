{id:2,title:'悉达多',author:'赫尔曼·黑塞',score:'9.3',color:'#d9c1a0',ink:'#453d30',en:'SIDDHARTHA',mark:'◒',category:'文学',tag:'每个人都有自己的河流',desc:'一个年轻人离开熟悉的生活，在行走、相遇和倾听中寻找自我。关于成长的答案，藏在每一次真实的体验里。'},
{id:3,title:'也许你该找个人聊聊',author:'洛莉·戈特利布',score:'9.0',color:'#e6d8ad',ink:'#534b37',en:'MAYBE YOU SHOULD TALK',mark:'☼',category:'心理',tag:'每一种感受，都值得被看见',desc:'当倾听者也需要被倾听，我们看见人与人之间相似的脆弱和勇气。从理解自己的感受开始，与生活重新建立连接。'},
{id:4,title:'人类群星闪耀时',author:'斯蒂芬·茨威格',score:'9.2',color:'#374e67',ink:'#f0e4ce',en:'DECISIVE MOMENTS',mark:'✦',category:'历史',tag:'那些改变世界的瞬间',desc:'把目光投向历史的转折处，走近那些在关键时刻作出选择的人。宏大的时代，在一个个微小而具体的瞬间展开。'},

let saved;try{saved=JSON.parse(localStorage.getItem('yuejian-state')||'{}')}catch(e){saved={}}let state={shelf:[1,2,5],current:1,chapter:0,theme:'paper',font:20,bookmarks:[],notes:[],...saved};let view='discover',category='全部',query='',currentBook=1,priorFocus=null;const $=id=>document.getElementById(id);const icon=n=>`<svg class="icon"><use href="#${n}"/></svg>`;function persist(){try{localStorage.setItem('yuejian-state',JSON.stringify(state))}catch(e){}}function toast(s){$('toast').textContent=s;$('toast').classList.remove('hidden');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('toast').classList.add('hidden'),2300)}function cover(b,cls=''){return `<div class="cover ${cls}" style="background:${b.color};color:${b.ink}"><div class="cover-en">${b.en}</div><div class="cover-title">${b.title}</div><div class="cover-mark">${b.mark}</div><div class="cover-author">${b.author}</div></div>`}function bookCard(b){return `<button class="book-item" onclick="detail(${b.id})" aria-label="查看${b.title}">${cover(b)}<h3>${b.title}</h3><p>${b.author}</p><div class="book-meta"><span class="score">${b.score} <span style="font-size:8px">推荐值</span></span><span>${state.shelf.includes(b.id)?'已在书架':'可试读'}</span></div></button>`}function navigate(v){view=v;category='全部';query='';$('searchInput').value='';render();window.scrollTo(0,0)}document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>navigate(b.dataset.view));function render(){document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));if(query){renderList('搜索结果',`找到 ${filterBooks(books).length} 本相关书籍`,books);return}if(view==='discover')renderDiscover();if(view==='all')renderList('发现好书','每一本书，都是一个新的世界',books);if(view==='ranking')renderList('口碑榜单','读者喜爱的高分好书',[...books].sort((a,b)=>Number(b.score)-Number(a.score)));if(view==='shelf')renderList('我的书架','收藏喜欢的书，让阅读随时发生',books.filter(b=>state.shelf.includes(b.id)));if(view==='notes')renderNotes();if(view==='profile')renderProfile()}function filterBooks(list){return list.filter(b=>(category==='全部'||b.category===category)&&(!query||`${b.title}${b.author}`.toLowerCase().includes(query.toLowerCase())))}function renderList(title,subtitle,list){$('page').innerHTML=`<div class="heading"><div><div class="eyebrow">YOUR READING SPACE</div><h1>${title}</h1><p>${subtitle}</p></div><span class="subtle">${filterBooks(list).length} 本书</span></div><div class="categories">${['全部','文学','心理','历史','社科'].map(c=>`<button class="chip ${category===c?'active':''}" onclick="setCategory('${c}')">${c}</button>`).join('')}</div><div class="books all-books">${filterBooks(list).map(bookCard).join('')||'<div class="empty"><div class="empty-icon">⌕</div>这里还没有书，去发现页寻找下一本吧。</div>'}</div>`}function setCategory(c){category=c;render()}function renderDiscover(){const b=books.find(b=>b.id===state.current)||books[0];$('page').innerHTML=`<div class="heading"><div><h1>发现好书</h1><p>每一次翻开，都是新的相遇</p></div><button class="subtle" onclick="toast('今日精选已更新，为你推荐 8 本好书')">每日精选 ✦</button></div><section class="hero"><div class="hero-copy"><span class="pill">本周共读 · 回归内心</span><h2>心有一片湖，<br>日子便有了留白。</h2><p>与梭罗一起，寻找简单生活的答案</p><button class="primary" onclick="openReader(1)">立即阅读 <span style="margin-left:12px">→</span></button></div>${cover(books[0],'hero-book')}<div class="dots"><i></i><i></i><i></i></div></section><div class="app-shortcuts"><button class="shortcut" onclick="showAll()"><span>▤</span>分类书城</button><button class="shortcut" onclick="showRanking()"><span>♕</span>口碑榜单</button><button class="shortcut" onclick="showLiterature()"><span>♧</span>文学精选</button><button class="shortcut" onclick="navigate('shelf')"><span>♡</span>我的收藏</button></div><section><div class="section-title"><h2>为你推荐</h2><button class="subtle" onclick="showAll()">全部 ›</button></div><div class="books">${books.slice(1,4).map(bookCard).join('')}</div></section><section class="continue-app">${cover(b,'mini-cover')}<div class="continue-app-info"><small>继续上次的阅读</small><h3>${b.title}</h3><p>第 ${state.chapter+1} 章 · 已读 ${Math.round((state.chapter+1)/3*100)}%</p></div><button class="continue-play" onclick="openReader(${b.id},true)" aria-label="继续阅读${b.title}">▶</button></section><section class="app-section"><div class="section-title"><h2>把时光读成故事</h2><button class="subtle" onclick="showLiterature()">更多 ›</button></div><div class="books">${[books[4],books[0],books[7]].map(bookCard).join('')}</div></section><div class="quote"><span class="quote-symbol">“</span><div><p>不必匆忙，不必火花四溅。<br>不必成为别人，只需成为自己。</p><small>今日一语</small></div><button class="subtle" style="margin-left:auto;white-space:nowrap" onclick="saveNote()">＋ 摘录</button></div>`}function showRanking(){view='ranking';category='全部';renderList('口碑榜单','读者喜爱的高分好书',[...books].sort((a,b)=>Number(b.score)-Number(a.score)));document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view==='discover'))}function showLiterature(){view='all';category='文学';renderList('文学精选','在故事里，遇见更辽阔的自己',books);document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view==='discover'))}function showAll(){view='all';renderList('发现好书','每一本书，都是一个新的世界',books);document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view==='discover'))}function renderNotes(){$('page').innerHTML=`<div class="heading"><div><div class="eyebrow">WORDS TO KEEP</div><h1>我的笔记</h1><p>留住那些，让你停下来的句子。</p></div><span class="subtle">${state.notes.length} 条摘录</span></div>${state.notes.length?state.notes.map((n,i)=>`<div class="note"><div>${n}</div><small>阅间 · 我的摘录</small><button class="subtle" style="float:right" onclick="deleteNote(${i})">删除</button></div>`).join(''):'<div class="empty"><div class="empty-icon">✎</div>还没有摘录。在发现页收藏今日一语，或在阅读器中保存段落。</div>'}`}function saveNote(){const n='不必匆忙，不必火花四溅。不必成为别人，只需成为自己。';if(state.notes.includes(n)){toast('这句已在你的笔记里');return}state.notes.push(n);persist();toast('已保存到我的笔记')}function deleteNote(i){state.notes.splice(i,1);persist();renderNotes()}function renderProfile(){$('page').innerHTML=`<div class="heading"><div><div class="eyebrow">MY READING JOURNEY</div><h1>你好，青禾。</h1><p>阅读，是一场与自己的相逢。</p></div><span class="avatar" style="width:55px;height:55px">青</span></div><div class="stat-grid"><div class="stat"><strong>${state.shelf.length}</strong><span>书架藏书</span></div><div class="stat"><strong>${state.notes.length}</strong><span>阅读摘录</span></div><div class="stat"><strong>${state.bookmarks.length}</strong><span>我的书签</span></div></div><div class="reading-card"><h3>阅读偏好</h3><p class="subtle">选择你喜欢的阅读背景，设置会保存在本机。</p><div class="categories">${['paper','white','night'].map((t,i)=>`<button class="chip ${state.theme===t?'active':''}" onclick="setTheme('${t}');renderProfile()">${['暖纸色','纯净白','深夜黑'][i]}</button>`).join('')}</div></div><p class="subtle" style="line-height:2;margin-top:25px">阅间 · 交互原型<br>藏书、书签、摘录和阅读设置仅保存在当前浏览器。<br>阅读正文为原创演示内容，非对应图书原文。</p>`}function detail(id){const b=books.find(x=>x.id===id);currentBook=id;priorFocus=document.activeElement;$('detail').innerHTML=`<div class="modal"><button class="close" onclick="closeDetail()" aria-label="关闭书籍详情">×</button><div class="detail-top">${cover(b,'detail-cover')}<div class="detail-info"><span class="pill">${b.category} · 编辑推荐</span><h2>${b.title}</h2><p>${b.author}</p><div class="detail-score">${b.score}<small>推荐值 · 演示</small></div><p>${b.tag}</p></div></div><p class="detail-desc">${b.desc}</p><p class="subtle" style="font-size:11px">原型提供 3 章原创示例，展示阅读交互。</p><div class="detail-buttons"><button class="primary" onclick="openReader(${id})">开始试读</button><button class="secondary" onclick="toggleShelf(${id})">${state.shelf.includes(id)?'✓ 已加入书架 · 移除':'＋ 加入书架'}</button></div></div>`;$('detail').classList.remove('hidden');document.body.style.overflow='hidden';$('detail').querySelector('.close').focus()}function closeDetail(){$('detail').classList.add('hidden');document.body.style.overflow='';priorFocus?.focus()}function toggleShelf(id){if(state.shelf.includes(id)){state.shelf=state.shelf.filter(x=>x!==id);toast('已从书架移除')}else{state.shelf.push(id);toast('已加入书架')}persist();detail(id);render()}
const chapters=[{title:'把时间留给自己',text:['清晨，光从窗边一点点走进来。桌上放着一本还没有读完的书，书签停在昨天离开的地方。窗外的声音逐渐清晰，而此刻，我们可以先不着急出发。','阅读有时像一条安静的小路。它不催促你，也不要求你立刻抵达什么地方。你可以停下来看看路边的树，可以回头重读一句话，也可以只是带着一个问题，继续向前。','我们每天接收很多消息，却很少有机会认真倾听自己的想法。翻开书的片刻，是把分散在别处的注意力，轻轻收回身边。这样的时间，即使只有十分钟，也有自己的重量。','不必为读得慢而感到不安。一本书的价值，也许并不在于你翻过多少页，而在于某一句话让你想起了谁，某一段故事让你重新看见了什么。','试着把手机调成安静模式，给自己倒一杯水。今天，就从这里开始。把时间留给阅读，也把时间留给自己。']},{title:'在日常中发现丰盈',text:['午后的光线落在桌沿上，形成一条细细的金边。我们常常等待一次远行，等待生活终于出现值得记录的时刻，却忘记了平凡日子里也藏着许多微小的风景。','走过熟悉的街道时，试着换一种速度。看看那家很早开门的店，看看树影如何越过墙面。你会发现，同一条路在不同的季节，有不同的故事。','书中的世界让我们暂时离开日常，也教会我们更认真地回到日常。读过的句子，终究会融进我们看待生活的方式里。','所谓丰盈，也许不是拥有更多，而是能够察觉更多。察觉一场雨的气味，一次交谈中的善意，和终于独处时那份久违的自在。','给今天留下一个小小的标记吧。写下一句喜欢的话，或者记住一个温暖的瞬间。这些细碎的收藏，会慢慢变成属于你的精神花园。']},{title:'带着新的眼光出发',text:['当我们合上一本书，故事并不会立刻结束。它会在某个不经意的瞬间，再次与我们相遇。也许是在一次选择面前，也许是在与朋友的交谈中。','阅读带来的改变，往往非常安静。它不一定立刻给出答案，却让我们拥有更多理解问题的角度，和更愿意倾听的心。','每个人都有自己的阅读节奏。有人在清晨读诗，有人在深夜读故事，也有人总是带着一本书，在等待的时候翻上几页。无需比较，只要找到适合自己的方式。','让阅读成为生活的一部分，就像走路、喝水、看天空一样自然。没有必须完成的任务，也没有必须抵达的终点。只有一次又一次，真诚的相遇。','这一段试读到这里结束。但你的阅读旅程，仍然可以从下一本书的第一页重新开始。愿你带着新的眼光，走进每一个普通而珍贵的日子。']}];
function openReader(id,resume=false){closeDetail();if(!resume||state.current!==id)state.chapter=0;state.current=id;currentBook=id;persist();$('reader').classList.remove('hidden');document.body.style.overflow='hidden';setTheme(state.theme);renderChapter()}function closeReader(){$('reader').classList.add('hidden');$('readerPanel').classList.add('hidden');document.body.style.overflow='';persist();render()}function renderChapter(){const b=books.find(b=>b.id===state.current),c=chapters[state.chapter];$('readerTitle').textContent=b.title;$('article').innerHTML=`<div class="chapter-label">CHAPTER 0${state.chapter+1} · 原创演示正文</div><h1>${c.title}</h1>${c.text.map(p=>`<p>${p}</p>`).join('')}<div style="text-align:center;opacity:.6;font-size:12px;margin-top:35px">— 本章完 —</div><button class="secondary" style="display:block;margin:25px auto" onclick="saveParagraph()">✎ 摘录本章首段</button>`;$('reader').scrollTop=0;$('reader').style.setProperty('--font',state.font+'px');updateBookmark();persist()}function changeChapter(delta){const next=state.chapter+delta;if(next<0){toast('已经是第一章');return}if(next>=chapters.length){toast('已读完全部试读章节');return}state.chapter=next;$('readerPanel').classList.add('hidden');renderChapter()}function updateBookmark(){$('bookmark').textContent=state.bookmarks.includes(state.current+':'+state.chapter)?'★ 已收藏':'☆ 书签'}function toggleBookmark(){let key=state.current+':'+state.chapter;if(state.bookmarks.includes(key))state.bookmarks=state.bookmarks.filter(k=>k!==key);else state.bookmarks.push(key);persist();updateBookmark();toast(state.bookmarks.includes(key)?'已收藏本章书签':'已移除书签')}function saveParagraph(){const p=chapters[state.chapter].text[0];if(state.notes.includes(p)){toast('这段已经摘录过了');return}state.notes.push(p);persist();toast('已摘录到我的笔记')}function setTheme(t){state.theme=t;$('reader').classList.remove('night','white');if(t!=='paper')$('reader').classList.add(t);persist()}function fontSize(d){state.font=Math.max(16,Math.min(28,state.font+d));$('reader').style.setProperty('--font',state.font+'px');persist();$('fontValue').textContent=state.font}function readerPanel(type){const el=$('readerPanel');if(!el.classList.contains('hidden')&&el.dataset.type===type){el.classList.add('hidden');return}el.dataset.type=type;el.innerHTML=type==='toc'?`<h3>目录 · 3 章试读</h3>${chapters.map((c,i)=>`<button class="chapter" style="color:${state.chapter===i?'#3268ef':'inherit'}" onclick="jumpChapter(${i})">0${i+1}　${c.title} ${state.bookmarks.includes(state.current+':'+i)?'★':''}</button>`).join('')}`:`<h3>阅读设置</h3><div style="display:flex;align-items:center;justify-content:space-between">字号 <div><button onclick="fontSize(-2)">A−</button><span id="fontValue" style="padding:0 12px">${state.font}</span><button onclick="fontSize(2)">A＋</button></div></div><div style="margin-top:15px">背景 <button onclick="setTheme('paper')">暖纸色</button><button onclick="setTheme('white')">纯净白</button><button onclick="setTheme('night')">深夜黑</button></div>`;el.classList.remove('hidden')}function jumpChapter(i){state.chapter=i;$('readerPanel').classList.add('hidden');renderChapter()}$('searchInput').addEventListener('input',e=>{query=e.target.value.trim();category='全部';render()});$('detail').addEventListener('click',e=>{if(e.target===$('detail'))closeDetail()});document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!$('detail').classList.contains('hidden'))closeDetail();else if(!$('readerPanel').classList.contains('hidden'))$('readerPanel').classList.add('hidden');else if(!$('reader').classList.contains('hidden'))closeReader()}if(!$('reader').classList.contains('hidden')&&e.target.tagName!=='INPUT'){if(e.key==='ArrowRight')changeChapter(1);if(e.key==='ArrowLeft')changeChapter(-1)}});$('detail').addEventListener('keydown',e=>{if(e.key!=='Tab')return;const nodes=[...$('detail').querySelectorAll('button')];if(e.shiftKey&&document.activeElement===nodes[0]){e.preventDefault();nodes.at(-1).focus()}else if(!e.shiftKey&&document.activeElement===nodes.at(-1)){e.preventDefault();nodes[0].focus()}});$('appTime').textContent=new Intl.DateTimeFormat('zh-CN',{hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date());$('date').textContent=new Intl.DateTimeFormat('zh-CN',{month:'long',day:'numeric',weekday:'long'}).format(new Date())+'　/　给阅读一点时间';render();
</script></body></html>
